<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Meridium</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }
    button { grid-column: span 2; padding: 0.5rem; }
    section { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid #ddd; }
    .progress-track { background: #eee; border-radius: 4px; overflow: hidden; height: 1.5rem; margin: 0.5rem 0; }
    .progress-fill { background: #2c7a4b; height: 100%; color: white; font-size: 0.8rem; text-align: right; padding-right: 0.4rem; box-sizing: border-box; white-space: nowrap; }
    .narrative { font-style: italic; color: #555; }
    #live-map { background: #0b1e33; border-radius: 4px; display: block; }
    .map-legend { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem; font-size: 0.85rem; }
    .map-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
    .map-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
  <h1>Meridium</h1>
  <p>Global tracking manifest dashboard</p>

  <form id="manifest-form">
    <input name="commodity_code" placeholder="Commodity code (e.g. AGRI_WHEAT)" required />
    <input name="total_mass_kg" placeholder="Mass (kg)" type="number" step="0.01" required />
    <input name="total_volume_m3" placeholder="Volume (m3)" type="number" step="0.01" required />
    <input name="origin_node_id" placeholder="Origin node ID" required />
    <input name="destination_node_id" placeholder="Destination node ID" required />
    <input name="required_engine_archetype" placeholder="Archetype (MOVER/CREATOR/CONSUMER)" />
    <button type="submit">Create manifest</button>
  </form>

  <table>
    <thead>
      <tr><th>Commodity</th><th>Mass (kg)</th><th>Origin</th><th>Destination</th><th>Status</th></tr>
    </thead>
    <tbody id="manifest-rows"></tbody>
  </table>

  <section>
    <h2>Story Events</h2>
    <select id="event-select"></select>
    <div id="event-details"></div>
  </section>

  <section>
    <h2>Live Map</h2>
    <p>Abstract logistics-space view — not real-world geography. Positions are reported by connected Client Trackers over <code>/ws/telemetry</code> and relayed here via <code>/ws/live</code>.</p>
    <canvas id="live-map" width="600" height="400"></canvas>
    <div class="map-legend" id="map-legend"></div>
    <p id="map-status">Connecting...</p>
  </section>

  <script>
    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }

    async function loadManifests() {
      const res = await fetch("/api/manifests");
      const manifests = await res.json();
      const rows = document.getElementById("manifest-rows");
      rows.innerHTML = manifests.map((m) => `
        <tr>
          <td>${escapeHtml(m.commodity_code)}</td>
          <td>${escapeHtml(m.total_mass_kg)}</td>
          <td>${escapeHtml(m.origin_node_id)}</td>
          <td>${escapeHtml(m.destination_node_id)}</td>
          <td>${escapeHtml(m.current_status)}</td>
        </tr>
      `).join("");
    }

    document.getElementById("manifest-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const body = Object.fromEntries(form.entries());
      await fetch("/api/manifests", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      e.target.reset();
      loadManifests();
    });

    async function loadEventOptions() {
      const res = await fetch("/api/story-events?status=ACTIVE");
      const events = await res.json();
      const select = document.getElementById("event-select");

      if (events.length === 0) {
        select.innerHTML = "<option>No active events</option>";
        document.getElementById("event-details").innerHTML = "";
        return;
      }

      select.innerHTML = events.map((e) => `<option value="${e.event_id}">${escapeHtml(e.title)}</option>`).join("");
      select.onchange = () => loadEventProgress(select.value);
      loadEventProgress(select.value);
    }

    async function loadEventProgress(eventId) {
      const res = await fetch(`/api/story-events/${eventId}/progress`);
      const data = await res.json();
      const pct = Math.min(100, (Number(data.total_mass_kg) / Number(data.goal_mass_kg)) * 100).toFixed(1);

      const companyRows = data.by_company.map((c) => `
        <tr><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.contributed_mass_kg)} kg</td></tr>
      `).join("") || "<tr><td colspan=\"2\">No contributions yet</td></tr>";

      const playerRows = data.by_player.map((p) => `
        <tr><td>${escapeHtml(p.display_name || p.player_uuid)}</td><td>${escapeHtml(p.contributed_mass_kg)} kg</td></tr>
      `).join("") || "<tr><td colspan=\"2\">No contributions yet</td></tr>";

      document.getElementById("event-details").innerHTML = `
        <p class="narrative">${escapeHtml(data.event.narrative)}</p>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${pct}%">${pct}%</div>
        </div>
        <p>${escapeHtml(data.total_mass_kg)} / ${escapeHtml(data.goal_mass_kg)} kg</p>
        <h3>By Company</h3>
        <table><tbody>${companyRows}</tbody></table>
        <h3>By Player</h3>
        <table><tbody>${playerRows}</tbody></table>
      `;
    }

    const MEDIUM_COLORS = {
      HIGHWAY: "#e0a72c",
      RAIL: "#8a6de0",
      MARITIME: "#2ca7e0",
      AVIATION: "#e05a5a",
      ORBITAL: "#5ae0a0",
    };

    function setupLiveMap() {
      const canvas = document.getElementById("live-map");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("map-status");
      const legendEl = document.getElementById("map-legend");
      const players = new Map(); // player_uuid -> { x, y, medium, at }

      legendEl.innerHTML = Object.entries(MEDIUM_COLORS)
        .map(([medium, color]) => `<span><i style="background:${color}"></i>${medium}</span>`)
        .join("");

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = Date.now();
        for (const [playerUuid, p] of players) {
          // drop markers we haven't heard from in a while so the map doesn't accumulate stale dots
          if (now - p.receivedAt > 30000) {
            players.delete(playerUuid);
            continue;
          }
          const px = (p.x / 1000) * canvas.width;
          const py = (p.y / 1000) * canvas.height;
          ctx.beginPath();
          ctx.arc(px, py, 5, 0, Math.PI * 2);
          ctx.fillStyle = MEDIUM_COLORS[p.medium] || "#ffffff";
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = "10px system-ui, sans-serif";
          ctx.fillText(playerUuid, px + 8, py + 3);
        }
      }

      function connect() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${location.host}/ws/live`);

        ws.onopen = () => { statusEl.textContent = `Connected. ${players.size} tracked.`; };
        ws.onclose = () => {
          statusEl.textContent = "Disconnected, retrying...";
          setTimeout(connect, 2000);
        };
        ws.onerror = () => ws.close();

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type !== "position") return;
          players.set(msg.player_uuid, { x: msg.x, y: msg.y, medium: msg.medium, receivedAt: Date.now() });
          statusEl.textContent = `Connected. ${players.size} tracked.`;
          draw();
        };
      }

      connect();
      setInterval(draw, 1000); // also redraw periodically so stale markers expire even without new messages
    }

    loadManifests();
    loadEventOptions();
    setupLiveMap();
  </script>
</body>
</html>
